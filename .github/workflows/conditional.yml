name: conditional

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Kies de omgeving"
        required: true
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  conditionals:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
    steps:
      - name: Production
        if: github.event.inputs.environment == 'production'
        run: |
          echo "Deploying to production!"

      - name: Development of staging
        if: github.event.inputs.environment == 'development' || github.event.inputs.environment == 'staging'
        run: |
          echo "Running in test mode"

      - name: Gekozen environment tonen
        if: always()
        run: |
          echo "Gekozen environment: $ENVIRONMENT"
